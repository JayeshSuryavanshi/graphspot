[project]
name = "graphspot"
version = "0.1.0a1"
description = "Inductive graph anomaly detection with honest baselines. Scores nodes and edges it has never seen, installs without torch."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Jayesh Suryavanshi", email = "jayeshsuryavanshi808@gmail.com" }]
keywords = ["anomaly-detection", "graph", "fraud-detection", "outlier-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "xgboost>=2.0",
]

[project.optional-dependencies]
deep = ["torch>=2.2", "torch_geometric>=2.5"]

[project.urls]
Repository = "https://github.com/JayeshSuryavanshi/graphspot"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphspot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
